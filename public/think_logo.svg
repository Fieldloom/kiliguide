<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>
  <g transform="translate(15, 10)">
    <!-- 'th' -->
    <path d="M 15 25 L 28 25 L 28 42 L 40 42 L 40 25 L 53 25 L 53 85 L 40 85 L 40 54 L 28 54 L 28 85 L 15 85 Z" fill="#383838"/>
    
    <!-- 'i' in purple -->
    <path d="M 58 35 L 72 35 L 72 85 L 58 85 Z" fill="#7E3AF2"/>
    <circle cx="65" cy="22" r="7" fill="#7E3AF2"/>
    
    <!-- 'n' -->
    <path d="M 77 42 L 90 42 L 90 50 C 94 44 101 41 109 41 C 122 41 129 49 129 63 L 129 85 L 116 85 L 116 65 C 116 57 111 53 104 53 C 97 53 90 58 90 67 L 90 85 L 77 85 Z" fill="#383838"/>
    
    <!-- 'k' -->
    <path d="M 134 25 L 147 25 L 147 52 L 165 42 L 181 42 L 160 59 L 182 85 L 165 85 L 147 64 L 147 85 L 134 85 Z" fill="#383838"/>
    
    <!-- Subtitle: TECH INNOVATORS NETWORK -->
    <text x="77" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7E3AF2" letter-spacing="0.5">TECH INNOVATORS</text>
    <text x="77" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#7E3AF2" letter-spacing="0.5">NETWORK</text>
    
    <!-- Network & Person Icon -->
    <g transform="translate(185, 10) scale(0.95)">
      <!-- Network Nodes & Links -->
      <line x1="30" y1="20" x2="10" y2="32" stroke="#555" stroke-width="3"/>
      <line x1="30" y1="20" x2="50" y2="32" stroke="#555" stroke-width="3"/>
      <line x1="10" y1="32" x2="10" y2="52" stroke="#555" stroke-width="3"/>
      <line x1="50" y1="32" x2="50" y2="52" stroke="#555" stroke-width="3"/>
      <line x1="10" y1="52" x2="30" y2="65" stroke="#555" stroke-width="3"/>
      <line x1="50" y1="52" x2="30" y2="65" stroke="#555" stroke-width="3"/>
      <line x1="30" y1="20" x2="30" y2="40" stroke="#7E3AF2" stroke-width="3"/>
      
      <!-- Outer Nodes -->
      <circle cx="30" cy="20" r="6" fill="#7E3AF2"/>
      <circle cx="10" cy="32" r="6" fill="#555"/>
      <circle cx="50" cy="32" r="6" fill="#555"/>
      <circle cx="10" cy="52" r="6" fill="#7E3AF2"/>
      <circle cx="50" cy="52" r="6" fill="#7E3AF2"/>
      <circle cx="30" cy="65" r="6" fill="#555"/>
      
      <!-- Person Symbol inside network -->
      <circle cx="30" cy="42" r="5" fill="#383838" stroke="#ffffff" stroke-width="2"/>
      <path d="M 20 62 C 20 50 40 50 40 62" fill="none" stroke="#383838" stroke-width="3" stroke-linecap="round"/>
      <line x1="30" y1="62" x2="30" y2="78" stroke="#383838" stroke-width="3"/>
      <line x1="30" y1="78" x2="22" y2="92" stroke="#383838" stroke-width="3"/>
      <line x1="30" y1="78" x2="38" y2="92" stroke="#383838" stroke-width="3"/>
    </g>
